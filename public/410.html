<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>410 Gone — Content Discontinued | DigitalMUID</title>
    <meta name="robots" content="noindex, follow">
    <style>
      body {
        margin: 0;
        background-color: #07111F;
        color: #E2E8F0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 540px;
        background: #0A1A2F;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .tag {
        display: inline-block;
        padding: 4px 12px;
        background: rgba(255, 107, 0, 0.15);
        color: #FF6B00;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 800;
        color: #FFFFFF;
      }
      p {
        margin: 0 0 28px;
        color: #94A3B8;
        font-size: 15px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #FF6B00;
        color: #FFFFFF;
      }
      .btn-primary:hover {
        background: #E66000;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #CBD5E1;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">HTTP 410 Gone</div>
      <h1>Content Permanently Retired</h1>
      <p>
        The page you are looking for was part of the legacy WordPress website and has been permanently discontinued during our platform modernization.
      </p>
      <div class="actions">
        <a href="/services" class="btn btn-primary">Explore Services</a>
        <a href="/learn" class="btn btn-secondary">Learning Platform</a>
      </div>
    </div>
  </body>
</html>
