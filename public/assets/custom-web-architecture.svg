    <rect x="565" y="245" width="180" height="42" rx="6" fill="#132B47" stroke="#1E3A5F" stroke-width="1" />
    <circle cx="582" cy="266" r="10" fill="#10B981" opacity="0.2" />
    <text x="600" y="263" font-family="-apple-system, sans-serif" font-size="9" fill="#FFFFFF" font-weight="700">99/100 Core Web Vitals</text>
