  <circle cx="120" cy="420" r="100" fill="#FF6B00" opacity="0.12" filter="url(#glow2)" />

  <!-- Window Header Bar -->
  <rect x="35" y="30" width="730" height="36" rx="8" fill="#163252" />
  <circle cx="55" cy="48" r="4.5" fill="#EF4444" />
  <circle cx="70" cy="48" r="4.5" fill="#F59E0B" />
  <circle cx="85" cy="48" r="4.5" fill="#10B981" />
