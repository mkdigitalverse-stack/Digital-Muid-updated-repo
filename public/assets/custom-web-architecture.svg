    <rect width="160" height="40" rx="8" fill="#0B1A2F" stroke="#10B981" stroke-width="1.2" filter="url(#glow2)" />
    <circle cx="20" cy="20" r="9" fill="#10B981" opacity="0.25" />
    <path d="M 15 20 L 18 23 L 25 17" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="18" font-family="-apple-system, sans-serif" font-size="10" fill="#FFFFFF" font-weight="700">Bespoke Architecture</text>
