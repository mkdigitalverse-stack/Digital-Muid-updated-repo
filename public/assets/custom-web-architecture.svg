    <circle cx="390" cy="320" r="12" fill="#10B981" opacity="0.2" />
    <rect x="385" y="315" width="10" height="10" rx="2" fill="#10B981" />
    <rect x="385" y="344" width="95" height="9" rx="2" fill="#FFFFFF" />
    <rect x="385" y="360" width="105" height="6" rx="2" fill="#64748B" />
    <rect x="385" y="372" width="90" height="6" rx="2" fill="#64748B" />
    <rect x="385" y="384" width="100" height="6" rx="2" fill="#64748B" />
    <rect x="385" y="420" width="60" height="14" rx="3" fill="#10B981" opacity="0.25" />
