name: Disposable PostgreSQL 17 V4.3 Migration & Concurrency Tests

on:
  push:
    branches: [ ci/local-supabase-integration ]
  pull_request:
    branches: [ ci/local-supabase-integration ]

jobs:
  local-supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-supabase@v1
        with:
          supabase-version: 'v3.4.0'

      - name: Start Local Supabase
        run: supabase start

      - name: Reset Database and Replay Standard Migrations
        run: |
          # Isolate Phase B concurrent index migration to prevent bundled pipeline transaction errors
          mkdir -p .migration_staging
          if [ -f "supabase/migrations/20261107000002_concurrent_indexes.sql" ]; then
            mv supabase/migrations/20261107000002_concurrent_indexes.sql .migration_staging/
          fi
          
          supabase db reset --no-seed

      - name: Execute Phase B Concurrent Indexes Safely Outside Pipeline
        run: |
          # Restore Phase B migration and execute via psql with autocommit / standalone execution
          if [ -f ".migration_staging/20261107000002_concurrent_indexes.sql" ]; then
            mv .migration_staging/20261107000002_concurrent_indexes.sql supabase/migrations/
          fi
          
          DB_URL=$(supabase status --output json | jq -r .DB_URL)
          echo "Executing Phase B concurrent indexes against local database..."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000002_concurrent_indexes.sql

      - name: Run Offline Security Regression & Verification Suite
        run: node run_offline_regression.mjs
