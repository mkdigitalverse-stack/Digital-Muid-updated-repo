      (function() {
        function isWsError(err) {
          if (!err) return false;
          var msg = (err.message || err.reason?.message || err.reason || err) + '';
          return msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.error || event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

          var effectiveResId = rawResId || (isBundlePath ? BUNDLE_ID : '');

          if (token) {

            var persistedToSession = false;

            if (orderId && paymentId) {

                if (w.sessionStorage) {
                  if (effectiveResId) {
                    w.sessionStorage.setItem('dm_guest_res_tok_' + effectiveResId + '_' + orderId + '_' + paymentId, token);
                    if (effectiveResId === BUNDLE_ID || effectiveResId === BUNDLE_SLUG) {
                      w.sessionStorage.setItem('dm_guest_res_tok_' + BUNDLE_ID + '_' + orderId + '_' + paymentId, token);
                      w.sessionStorage.setItem('dm_guest_res_tok_' + BUNDLE_SLUG + '_' + orderId + '_' + paymentId, token);

              // Retain in memory ONLY for current page session when sessionStorage fails, with bounded cleanup

                  var cleanupMem = function() {

                  };
                  w.addEventListener('pagehide', cleanupMem, { once: true });
                  Object.defineProperty(w, '__dmConsumeBootstrapGuestToken', {

                      var val = memToken;

                      return val;
                    }

                } catch (defErr) {}
              }
            }

            sp.delete('resourceAccessToken');
            sp.delete('resource_access_token');
            var nextQs = sp.toString();
            var cleanRelUrl = (w.location.pathname || '/') + (nextQs ? '?' + nextQs : '') + (w.location.hash || '');
